<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132238">
  <title>Registros de empleados</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">RESUMEN</p>
      <h1>Registros de empleados</h1>
      <p>Consultá las ventas y comisiones guardadas en este navegador.</p>
    </header>
    <section class="panel">
      <div class="table-toolbar">
        <h2>Detalle de ventas</h2>
        <div class="form-actions">
          <button class="button button-secondary" id="back-button" type="button">Volver al registro</button>
          <button class="button button-danger" id="clear-button" type="button">Vaciar registros</button>
        </div>
      </div>
      <p id="records-message" class="form-message" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table id="employee-table">
          <thead>
            <tr><th>Día</th><th>Empleado</th><th>Venta</th><th>Comisión (%)</th><th>Comisión ($)</th></tr>
          </thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
    </section>
    <p class="storage-note">Importante: los registros usan el almacenamiento local del navegador; borrar los datos del navegador puede eliminarlos.</p>
  </main>
  <script src="datos.js"></script>
</body>
</html>
